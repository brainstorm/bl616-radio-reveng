[package]
name = "bl616-wifi-sys"
description = "Raw FFI bindings to the Bouffalo BL616 WiFi 6 stack (fhost/macsw/phyrf) plus its FreeRTOS + lwIP substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "bl616_wifi_csdk"
build = "build.rs"

[features]
# Use the generated bindings instead of the hand-written FFI. Kept so the
# hand-written set can be cross-checked against the headers.
bindgen = ["dep:bindgen"]
# Drop the mbedTLS crypto backend from libwpa_supplicant.a so bl616-crypto can
# provide those symbols instead. The archive is linked with --whole-archive,
# so the object has to go rather than merely be out-competed.
rust-crypto = []
# Put the console on the BL616's own USB peripheral (CherryUSB CDC-ACM)
# instead of UART0. On boards whose USB-C goes straight into the chip — the
# Sipeed M0S Dock, for one — this is the difference between needing an
# external TTL-USB adapter and needing nothing at all.
usb-console = []
# Drop lwIP and the vendor's lwIP-based net_al adapter from the link, so a
# Rust network stack can provide those entry points instead. Nothing supplies
# them yet, so this currently fails the link on purpose: the error list *is*
# the specification. See the engineering notes, "Stage 1".
rust-net = []

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }

[lints.rust]
# bindgen output is not our style problem
non_upper_case_globals = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
