[package]
name = "bl616-crypto"
description = "wpa_supplicant's crypto backend in Rust, replacing crypto_mbedtls_misc.c"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
cipher = "0.5"
md-5 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
digest = { version = "0.11", default-features = false, features = ["mac"] }
