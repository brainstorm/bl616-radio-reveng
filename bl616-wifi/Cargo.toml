[package]
name = "bl616-wifi"
description = "WPA2 station and access-point WiFi for the Bouffalo BL616, in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["bl616", "bouffalo", "wifi", "riscv", "embedded"]

[dependencies]
bl616-wifi-sys = { path = "../bl616-wifi-sys", version = "0.1.0" }
bl616-dhcp = { path = "../bl616-dhcp" }
bl616-crypto = { path = "../bl616-crypto", optional = true }

# The embassy front end. Optional: the default build and the smoltcp front end
# do not pull any of this in.
embassy-net-driver = { version = "0.2", optional = true }
embassy-time-driver = { version = "0.2", optional = true, features = ["tick-hz-1_000"] }
embassy-time-queue-utils = { version = "0.1", optional = true, features = ["generic-queue-32"] }
critical-section = { version = "1", optional = true, features = ["restore-state-bool"] }
embassy-sync = { version = "0.6", optional = true }
# No arch feature: the stock riscv32 executor parks the hart in WFI, which is
# wrong inside a FreeRTOS task. We drive raw::Executor and supply __pender.
embassy-executor = { version = "0.7", optional = true, default-features = false, features = [
    "task-arena-size-8192",
] }
smoltcp = { version = "0.14", optional = true, default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-icmp",
    # Without this smoltcp silently ignores echo requests -- the handler in
    # iface/interface/ipv4.rs is gated on it -- and the board answers ARP and
    # serves DHCP while appearing not to respond to ping at all.
    "auto-icmp-echo-reply",
] }

[features]
default = ["alloc", "panic-handler"]
# Route Rust's global allocator at the SDK's TLSF heap.
alloc = []
# Provide a #[panic_handler] that prints to the console and halts.
panic-handler = []
# Console over USB-CDC on the chip's own USB peripheral rather than UART0.
usb-console = ["bl616-wifi-sys/usb-console"]
# Stage 1 of the pure-Rust roadmap: drop lwIP and the vendor net_al adapter so
# a Rust stack can replace them. Does not link yet -- see the engineering notes.
rust-net = ["bl616-wifi-sys/rust-net", "dep:smoltcp", "alloc"]
# Log every net_al call the blob makes. Invaluable during bring-up: the blob
# is the only thing driving this surface, and nothing else reveals the order
# it does so in.
net-trace = ["rust-net"]
# Stage 4: wpa_supplicant's hashing, HMAC and AES come from RustCrypto rather
# than mbedTLS. All 34 entry points are replaced together -- see bl616-crypto.
rust-crypto = ["dep:bl616-crypto", "bl616-wifi-sys/rust-crypto"]
# Stage 3, first step: the blobs' rtos_* layer in Rust. Still forwards to
# FreeRTOS -- this moves the seam, not yet the scheduler behind it.
rust-rtos = ["bl616-wifi-sys/rust-rtos"]
# Present the MAC as an embassy-net Driver instead of driving smoltcp
# ourselves. The application brings its own embassy-net stack; this crate
# supplies the device, the time driver and an executor hosted on FreeRTOS.
#
# Implies rust-net because the vendor adapter and lwIP must still go, but
# takes the place of the smoltcp front end: the RX ring is single-consumer,
# so the poll task is not started when this is on.
embassy-net = [
    "rust-net",
    "dep:embassy-net-driver",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-sync",
    "dep:embassy-executor",
    "dep:critical-section",
]

[dev-dependencies]
# Only the embassy example needs these; the crate itself exposes a Driver and
# leaves the stack to the application.
embassy-net = { version = "0.9", default-features = false, features = [
    "proto-ipv4", "medium-ethernet", "dhcpv4", "udp", "tcp", "dns",
    # Same trap as our own smoltcp: without this the board answers ARP and
    # serves DHCP while appearing dead to ping. Each smoltcp instance needs
    # it enabled separately, and embassy-net has its own.
    "auto-icmp-echo-reply",
    # Our smoltcp 0.14 enables managed/alloc, and the two smoltcp versions
    # share that crate -- so embassy-net's copy must agree or its matches do
    # not cover ManagedSlice::Owned.
    "alloc",
] }
embassy-time = { version = "0.5", default-features = false }
static_cell = "2"

[[example]]
name = "hello"
required-features = ["panic-handler"]

[[example]]
name = "bringup"
required-features = ["panic-handler"]

[[example]]
name = "sta"
required-features = ["panic-handler"]

[[example]]
name = "ap"
required-features = ["panic-handler"]

[[example]]
name = "embassy_sta"
required-features = ["panic-handler", "embassy-net"]

[[example]]
name = "embassy_ap"
required-features = ["panic-handler", "embassy-net"]
